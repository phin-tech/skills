name: schemaviz tests

on:
  pull_request:
    paths: ["skills/schemaviz/**", ".github/workflows/schemaviz-*.yml"]
  push:
    branches: [main]
    paths: ["skills/schemaviz/**", ".github/workflows/schemaviz-*.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/schemaviz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m unittest discover -s tests -v
      - run: sh -n install.sh
