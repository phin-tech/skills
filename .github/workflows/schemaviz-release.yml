name: schemaviz release

# Push a tag like schemaviz-v0.2.0 (it must match __version__ in skills/schemaviz/schemaviz.py).
# Tests run in schemaviz-ci.yml; this builds one binary per platform, smoke-tests it, and attaches it with SHA256SUMS.
on:
  push:
    tags: ["schemaviz-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, asset: schemaviz-darwin-arm64 }
          - { os: macos-15-intel, asset: schemaviz-darwin-x64 }
          - { os: ubuntu-latest, asset: schemaviz-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: schemaviz-linux-arm64 }
          - { os: windows-latest, asset: schemaviz-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/schemaviz
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version in the code
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('schemaviz.py').read()).group(1))")
          [ "schemaviz-v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != schemaviz-v$v"; exit 1; }
      - run: python -m pip install pyinstaller
      - name: Build
        run: pyinstaller --onefile --name "${{ matrix.asset }}" --add-data "template.html${PATHSEP:-:}." schemaviz.py
        env:
          PATHSEP: ${{ runner.os == 'Windows' && ';' || ':' }}
      - name: Smoke test the binary
        run: |
          d=$(mktemp -d)
          printf 'Table t { id integer [pk] }\n' > "$d/t.dbml"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" render "$d/t.dbml" --out "$d/out.html" --expect 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: skills/schemaviz/dist/${{ matrix.asset }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum schemaviz-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" assets/* --repo "${GITHUB_REPOSITORY}" --title "schemaviz ${GITHUB_REF_NAME#schemaviz-v}" --generate-notes
