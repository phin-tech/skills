[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "schemaviz"
dynamic = ["version"]
description = "Draw a database schema, and what a migration changed, as an interactive HTML page"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2"]
django = ["django"]

[project.scripts]
schemaviz = "schemaviz:main"

[tool.setuptools]
py-modules = ["schemaviz"]

[tool.setuptools.dynamic]
version = { attr = "schemaviz.__version__" }

# the page template is read at run time; a wheel puts it in <prefix>/share/schemaviz
[tool.setuptools.data-files]
"share/schemaviz" = ["template.html"]
